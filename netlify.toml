[[headers]]
  for = "/published-data.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# El HTML y el JS tienen que revalidarse siempre: sin esto el navegador se queda con un app.js
# viejo mientras baja el index.html nuevo, y las funciones nuevas quedan sin efecto (pasó
# 2026-09-24 con el tilde "Unir solistas masculinos y femeninos").
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
